# 用法：见 docs/DEPLOY.md
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./data:/data
    expose:
      - "3000"

  # 反向代理：配置了域名会自动申请 HTTPS 证书；没有域名就用 IP 走 HTTP
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
